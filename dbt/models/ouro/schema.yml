version: 2

# OURO = MODELO ESTRELA com UMA fato (fato_incidente: incidentes detectados pela IA) e 8 dimensões. Todas as chaves são
# inteiros sequenciais id_*; 0 = membro "desconhecido" (sem chave nula na fato). Papéis: dim_data x3, dim_instalacao x2,
# dim_empresa x3 (no Power BI, uma relação ativa por dimensão e as demais inativas, com USERELATIONSHIP).
# Notícias processadas ficam fora da estrela: prata_noticias_processadas.
models:
  - name: dim_data
    description: "Datas (2015 até um ano à frente) + membro desconhecido (id 0 = 1900-01-01). id_data é sequencial; `data` é a data."
    columns:
      - name: id_data
        data_tests: [unique, not_null]

  - name: dim_fonte
    description: "Fontes das notícias (Google News ou portal especializado/sindical). Id 0 = desconhecida."
    columns:
      - name: id_fonte
        data_tests: [unique, not_null]

  - name: dim_localidade
    description: "Município+estado (em terra) ou bacia (offshore), normalizados. Id 0 = desconhecida."
    columns:
      - name: id_localidade
        data_tests: [unique, not_null]

  - name: dim_instalacao
    description: "Instalações e dutos da ANP + só do SISO + ativos que só a notícia cita. Id 0 = desconhecida. Dois papéis na fato."
    columns:
      - name: id_instalacao
        data_tests: [unique, not_null]

  - name: dim_empresa
    description: "Empresas (operadora do contrato, da instalação, empresa do SISO). Três papéis na fato. Id 0 = desconhecida."
    columns:
      - name: id_empresa
        data_tests: [unique, not_null]

  - name: dim_tipo_evento
    description: "Tipo do evento classificado pela IA. Id 0 = não informado."
    columns:
      - name: id_tipo_evento
        data_tests: [unique, not_null]

  - name: dim_severidade
    description: "Severidade (CRÍTICO, ALTO, MÉDIO, INFORMATIVO, Não Informada) com coluna de ordem."
    columns:
      - name: id_severidade
        data_tests: [unique, not_null]

  - name: dim_status_cruzamento
    description: "Resultado do cruzamento do incidente com o SISO."
    columns:
      - name: id_status_cruzamento
        data_tests: [unique, not_null]

  - name: fato_incidente
    description: "Única fato. Uma linha por incidente detectado pela IA, cruzado com o SISO quando há correspondência. Medidas: qtd_incidente, vitimas, qtd_noticias_do_evento, confianca, score_cruzamento."
    columns:
      - name: id_incidente
        data_tests: [unique, not_null]
      - name: data_fato
        data_tests: [not_null]
      - name: data_publicacao
        data_tests: [not_null]
      - name: id_data_fato
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_data')
                field: id_data
      - name: id_data_publicacao
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_data')
                field: id_data
      - name: id_data_siso
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_data')
                field: id_data
      - name: id_fonte
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fonte')
                field: id_fonte
      - name: id_localidade
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_localidade')
                field: id_localidade
      - name: id_instalacao
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_instalacao')
                field: id_instalacao
      - name: id_instalacao_siso
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_instalacao')
                field: id_instalacao
      - name: id_empresa_contrato
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_empresa')
                field: id_empresa
      - name: id_empresa_instalacao
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_empresa')
                field: id_empresa
      - name: id_empresa_siso
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_empresa')
                field: id_empresa
      - name: id_tipo_evento
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_evento')
                field: id_tipo_evento
      - name: id_severidade
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_severidade')
                field: id_severidade
      - name: id_status_cruzamento
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_status_cruzamento')
                field: id_status_cruzamento
